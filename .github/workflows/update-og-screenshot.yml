name: Update OGP Screenshot

on:
  schedule:
    # 毎日 05:30 JST。公開サイトの表示更新を翌朝までに取り込む。
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: update-og-screenshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
    environment: production
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy latest develop preview
        id: preview
        run: |
          preview_url=$(pnpm dlx vercel@59.11.2 deploy --yes --token "$VERCEL_TOKEN")
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture latest develop mobile view
        run: pnpm og:screenshot
        env:
          OG_SCREENSHOT_URL: ${{ steps.preview.outputs.url }}

      - name: Upload captured screenshot
        uses: actions/upload-artifact@v4
        with:
          name: og-site-mobile
          path: web/public/img/og/site-mobile.png
          if-no-files-found: error

  publish:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.capture.outputs.source_sha }}
          fetch-depth: 0

      - name: Download captured screenshot
        uses: actions/download-artifact@v5
        with:
          name: og-site-mobile
          path: /tmp/og-site-mobile

      - name: Replace screenshot
        run: cp /tmp/og-site-mobile/site-mobile.png web/public/img/og/site-mobile.png

      - name: Create or update screenshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- web/public/img/og/site-mobile.png; then
            echo "The screenshot is unchanged."
            exit 0
          fi

          screenshot_branch="chore/update-og-screenshot"
          git fetch origin "$screenshot_branch:refs/remotes/origin/$screenshot_branch" || true
          git switch -C "$screenshot_branch" "${{ needs.capture.outputs.source_sha }}"
          git add web/public/img/og/site-mobile.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "OGP用モバイルスクリーンショットを更新"
          git push --force-with-lease origin "$screenshot_branch"

          pr_number=$(gh pr list \
            --head "$screenshot_branch" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base develop \
              --head "$screenshot_branch" \
              --title "OGP用モバイルスクリーンショットを更新" \
              --body $'## 概要\n\n最新の `develop` をプレビュー環境へデプロイし、トップページをモバイル幅で自動撮影します。サイト共通OGPに使うスクリーンショットを更新します。\n\n## 生成方法\n\n- Vercel preview（`develop`）\n- `pnpm og:screenshot`\n- 393 x 852 px\n- Playwright / Chromium\n\nこのPRは定期ワークフローによる自動更新です。'
          fi
