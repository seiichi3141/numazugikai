name: Migrate DB then Deploy

# main への push で本番へデプロイする。develop → main の昇格は /deploy で行う。
#
# 本家は Vercel の Deploy Hook を叩く方式だったが、Hook はプロジェクトを
# GitHub に Git 連携しておく必要がある。ここでは Vercel CLI をトークンで動かし、
# 初回の手動デプロイと同じ経路で Actions からもデプロイする。
# マイグレーションは DB へ直接接続して流す。CLI のアクセストークン検証を
# 通さないので、トークンの形式変更に左右されない。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest
      - name: Supabase db push
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
        env:
          # session pooler（5432）の接続文字列。IPv4 で繋がる
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            project_id_secret: VERCEL_PROJECT_ID_WEB
          - app: admin
            project_id_secret: VERCEL_PROJECT_ID_ADMIN
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      # ビルドは Vercel 側で行う。ローカルでビルドして --prebuilt で送る方式は
      # Actions の実行時間を食ううえ、Vercel の環境変数を pull する手間が増える。
      - name: Deploy ${{ matrix.app }} to production
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
